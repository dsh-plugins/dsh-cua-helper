name: Mirror CUA helpers

on:
  pull_request:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Exact upstream release tag (for example dsh-v0.2.3-alpha.2)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cua-mirror-${{ github.event_name == 'pull_request' && github.ref || 'publication' }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.22.3'

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node --test
      - run: |
          for script in scripts/*.mjs; do node --check "$script" || exit; done
          git show --format= --check HEAD -- .github scripts test README.md README.zh_CN.md LICENSE
        shell: bash

  prepare:
    needs: quality
    if: github.repository == 'dsh-plugins/dsh-cua-helper' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      pending: ${{ steps.plan.outputs.pending }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Discover and verify upstream snapshots
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: node scripts/prepare.mjs "$RUNNER_TEMP/pending"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.plan.outputs.pending != '0'
        with:
          name: source-snapshots
          path: ${{ runner.temp }}/pending/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  build:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    name: Build ${{ matrix.tag }} / ${{ matrix.target }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: source-snapshots
          path: ${{ runner.temp }}/pending/
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.x'
      - name: Build, test and package native helper
        shell: pwsh
        env:
          UPSTREAM_TAG: ${{ matrix.tag }}
          BUILD_TARGET: ${{ matrix.target }}
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: node scripts/build.mjs "$env:RUNNER_TEMP/pending/versions/$env:UPSTREAM_TAG" "$env:BUILD_TARGET" "$env:RUNNER_TEMP/binaries"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-${{ matrix.tag }}-${{ matrix.target }}
          path: ${{ runner.temp }}/binaries/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
          compression-level: 0

  publish:
    needs: [prepare, build]
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.pending != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: source-snapshots
          path: ${{ runner.temp }}/pending/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.prepare.outputs.count != '0'
        with:
          pattern: binary-*
          path: ${{ runner.temp }}/artifacts/
      - name: Validate assets and publish complete releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/publish.mjs "$RUNNER_TEMP/pending" "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/release-staging"
